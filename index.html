<style>

:root{
    --bg:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --card:#f8fafc;
    --border:#e5e7eb;
    --brand:#29cce6;
}

.dark{
    --bg:#0f172a;
    --text:#f8fafc;
    --muted:#94a3b8;
    --card:#1e293b;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
}

/* NAVIGATION */

header{
    position:sticky;
    top:0;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    z-index:1000;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:1rem 2rem;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:var(--brand);
    font-weight:bold;
    font-size:1.2rem;
}

.menu{
    display:flex;
    gap:2rem;
    align-items:center;
}

.menu a{
    text-decoration:none;
    color:var(--text);
}

.menu a:hover{
    color:var(--brand);
}

.theme-btn{
    border:none;
    padding:.6rem;
    border-radius:8px;
    cursor:pointer;
}

.hamburger{
    display:none;
    border:none;
    background:none;
    font-size:1.5rem;
    cursor:pointer;
}

/* HERO */

.hero{
    max-width:1100px;
    margin:auto;
    padding:80px 20px;
}

.hero h1{
    font-size:clamp(3rem,6vw,5rem);
    line-height:1.1;
    margin-bottom:20px;
}

.meta{
    color:var(--muted);
    margin-bottom:20px;
}

.intro{
    font-size:1.15rem;
    color:var(--muted);
    margin-bottom:40px;
}

.hero-image{
    width:100%;
    height:500px;
    border-radius:20px;
    background-image:url('images/home-hero.png');
    background-size:cover;
    background-position:center;
}

/* SECTION */

.content{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.content h2{
    margin-bottom:20px;
}

.content p{
    margin-bottom:20px;
}

.callout{
    background:var(--card);
    border-radius:20px;
    padding:30px;
    margin:30px 0;
}

/* PORTFOLIO CARD */

.project-card{
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
}

/* CAROUSEL */

.portfolio-slider{
    width:100%;
    overflow:hidden;
    margin-bottom:30px;
}

.slider-track{
    display:flex;
    gap:20px;
    width:max-content;
    animation:scroll 30s linear infinite;
}

.slide{
    width:400px;
    height:250px;
    flex-shrink:0;

    border-radius:16px;

    background:linear-gradient(
        135deg,
        #d9d9d9,
        #bdbdbd
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    color:#555;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-2100px);
    }

}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:16px;
}

/* BUTTON */

.button{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
}

/* CTA */

.cta{
    background:var(--card);
    text-align:center;
    padding:80px 20px;
    margin-top:60px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:40px;
    border-top:1px solid var(--border);
}
